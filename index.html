<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Test Task - Input Controller</title>
  <style>
    .playground {
      width: 400px;
      height: 400px;
      border: 2px solid #333;
      position: relative;
      background-color: #f9f9f9;
      float: left;
    }
    #box {
      width: 50px;
      height: 50px;
      background-color: blue;
      position: absolute;
      top: 0;
      left: 0;
      border-radius: 6px;
      transition: background-color 0.2s;
    }
    .log-panel {
      margin-left: 420px;
      width: 350px;
      height: 400px;
      border: 1px solid #ccc;
      padding: 10px;
      box-sizing: border-box;
      overflow-y: auto;
      font-family: monospace;
      font-size: 12px;
      background: #f9f9f9;
      color: black;
    }
  </style>
</head>
<body>

  <h2>Тестовое задание - Универсальный контроллер ввода</h2>

  <div>
    <button id="btn-attach">Attach (Прикрепить)</button>
    <button id="btn-detach">Detach (Открепить)</button>
    <button id="btn-enable">Enable (Включить)</button>
    <button id="btn-disable">Disable (Выключить)</button>
    <button id="btn-bind-jump">Добавить "Прыжок" (Space / ЛКМ)</button>
  </div>

  <div class="playground">
    <div id="box"></div>
  </div>

  <div id="log" class="log-panel">
    <div>--- Лог событий ---</div>
  </div>

  <!-- Подключение скриптов -->
  <script src="input-controller.js"></script>
  <script src="input-controller-test.js"></script>
  <script src="input-plugin.js"></script>
</body>
</html>
